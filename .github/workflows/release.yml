name: Release

# Pushing a tag such as v0.8.0 builds the installers and zips and attaches them to a pre-release for that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content NeonMon.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match version $version in NeonMon.csproj" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish the small build (needs the .NET 9 Desktop Runtime)
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish/small

      - name: Publish the standalone build
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/standalone

      - name: Self-test both builds
        shell: pwsh
        run: |
          foreach ($build in 'small', 'standalone') {
            $process = Start-Process -FilePath "publish\$build\NeonMon.exe" -ArgumentList '--self-test' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Self-test of the $build build failed with exit code $($process.ExitCode)" }
          }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\small\* -DestinationPath "NeonMon-$env:VERSION.zip"
          Compress-Archive -Path publish\standalone\* -DestinationPath "NeonMon-$env:VERSION-standalone.zip"

      # Pinned by hash so every release is built with the same Inno Setup.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'The Inno Setup download does not match the pinned hash' }
          $dir = "$env:RUNNER_TEMP\innosetup"
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installing Inno Setup failed with exit code $($process.ExitCode)" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($build in 'small', 'standalone') {
            & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/DBuild=$build" installer\NeonMon.iss
            if ($LASTEXITCODE -ne 0) { throw "Building the $build installer failed with exit code $LASTEXITCODE" }
          }

      # The notes are the tag's section of CHANGELOG.md, from its "## vX.Y.Z" heading to the next "## ".
      # Without a section the release falls back to GitHub's generated notes.
      - name: Read the release notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -ErrorAction SilentlyContinue
          $start = [array]::IndexOf([string[]]$lines, "## $env:GITHUB_REF_NAME")
          if ($start -ge 0) {
            $section = $lines | Select-Object -Skip ($start + 1) | ForEach-Object -Begin { $done = $false } -Process {
              if ($_ -match '^## ') { $done = $true }
              if (-not $done) { $_ }
            }
            ($section -join "`n").Trim() | Set-Content release-notes.md
            "NOTES=release-notes.md" >> $env:GITHUB_ENV
          } else {
            Write-Warning "CHANGELOG.md has no '## $env:GITHUB_REF_NAME' section; using generated notes."
          }

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "publish\NeonMon-$env:VERSION-setup.exe", "publish\NeonMon-$env:VERSION-standalone-setup.exe", "NeonMon-$env:VERSION.zip", "NeonMon-$env:VERSION-standalone.zip"
          $notes = if ($env:NOTES) { @('--notes-file', $env:NOTES) } else { @('--generate-notes') }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
            if ($LASTEXITCODE -eq 0 -and $env:NOTES) { gh release edit $env:GITHUB_REF_NAME --notes-file $env:NOTES }
          } else {
            gh release create $env:GITHUB_REF_NAME @files --prerelease @notes --title "NeonMon v$env:VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the downloads to the release" }
